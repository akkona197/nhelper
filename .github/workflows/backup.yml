name: Backup Supabase data

on:
  schedule:
    # 00:00 giờ Việt Nam (Asia/Bangkok, UTC+7) = 17:00 UTC hôm trước
    - cron: "0 17 * * *"
  workflow_dispatch: {} # cho phép bấm chạy tay trong tab Actions

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Export all tables to JSON
        env:
          # Set in Settings > Secrets and variables > Actions. Do not hardcode the project URL:
          # the app moved Supabase projects once and the hardcoded URL went stale.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          for v in SUPABASE_URL SERVICE_KEY BACKUP_PASSPHRASE; do
            if [ -z "${!v}" ]; then
              echo "::error::Missing secret for ${v}. Add SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY and BACKUP_PASSPHRASE in Settings > Secrets and variables > Actions."
              exit 1
            fi
          done
          TABLES="profiles projects labels tasks task_instances task_labels task_notes board_notes notifications feedback"
          mkdir -p backups
          DATE="$(date -u +%Y-%m-%d)"
          OUT="backups/backup-${DATE}.json"
          echo "{" > "$OUT"
          echo "  \"exported_at\": \"$(date -u +%FT%TZ)\"," >> "$OUT"
          echo "  \"project\": \"nhelper / Master Task\"," >> "$OUT"
          echo "  \"tables\": {" >> "$OUT"
          first=1
          for t in $TABLES; do
            echo "Fetching $t ..."
            data="$(curl -fsS "${SUPABASE_URL}/rest/v1/${t}?select=*" \
              -H "apikey: ${SERVICE_KEY}" \
              -H "Authorization: Bearer ${SERVICE_KEY}")"
            if [ "$first" -eq 0 ]; then echo "," >> "$OUT"; fi
            first=0
            printf '    "%s": %s' "$t" "$data" >> "$OUT"
          done
          echo "" >> "$OUT"
          echo "  }" >> "$OUT"
          echo "}" >> "$OUT"
          # Chuẩn hoá + kiểm tra JSON hợp lệ
          jq . "$OUT" > "${OUT}.tmp" && mv "${OUT}.tmp" "$OUT"
          echo "SIZE=$(wc -c < "$OUT") bytes"
          # This repo is public: workflow artifacts are downloadable by other GitHub users.
          # Encrypt the dump so only the passphrase holder can read user data.
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" \
            --symmetric --cipher-algo AES256 -o "${OUT}.gpg" "$OUT"
          rm -f "$OUT"
          echo "ARTIFACT_DATE=${DATE}" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: master-task-backup-${{ env.ARTIFACT_DATE }}
          path: backups/*.json.gpg
          retention-days: 90
